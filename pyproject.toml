[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "droid-agent"
version = "0.2.0"
description = "Agent-native Android control over stock adb — numbered UI refs, JSON output, MCP server. No Appium, no on-device APK."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "droid-agent contributors" }]
keywords = ["android", "adb", "agent", "mcp", "automation", "llm", "uiautomator", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/hyusband/droid-agent"
Repository = "https://github.com/hyusband/droid-agent"
Issues = "https://github.com/hyusband/droid-agent/issues"
Changelog = "https://github.com/hyusband/droid-agent/blob/main/CHANGELOG.md"

[project.scripts]
droid-agent = "droid_agent.cli:main"
da = "droid_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/droid_agent"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_adversarial"]
pythonpath = ["src"]
